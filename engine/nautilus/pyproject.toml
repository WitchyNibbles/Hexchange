[project]
name = "hexchange-nautilus"
version = "0.1.0"
description = "Local NautilusTrader runtime for Hexchange"
requires-python = ">=3.11"
dependencies = [
  "nautilus_trader[ib,docker]",
]

[project.scripts]
hexchange-nautilus = "hexchange_nautilus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
